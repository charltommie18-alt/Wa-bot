<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HowzitBot - Your AI Staff on WhatsApp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f0a;color:#e5ffe5;font-family:Inter,system-ui,sans-serif;line-height:1.6}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #1a2e1a}
.logo{font-size:22px;font-weight:800;color:#22c55e} .logo span{color:#fff}
.hero{padding:60px 0 40px;text-align:center}
.hero h1{font-size:42px;line-height:1.1;margin-bottom:16px} .hero h1 span{color:#22c55e}
.hero p{font-size:17px;color:#a3d9a3;max-width:650px;margin:0 auto 30px}
.badge{display:inline-block;background:#132813;border:1px solid #22c55e;color:#22c55e;padding:6px 14px;border-radius:20px;font-size:13px;margin-bottom:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:40px 0}
.card{background:#111e11;border:1px solid #1e3a1e;border-radius:12px;padding:20px}
.card h3{color:#fff;margin-bottom:6px;font-size:16px} .card p{color:#8abf8a;font-size:13px}
.pricing{background:#111e11;border:2px solid #22c55e;border-radius:16px;padding:28px;text-align:center;max-width:430px;margin:50px auto}
.price{font-size:52px;font-weight:900;color:#22c55e;margin:8px 0} .price small{font-size:16px;color:#8abf8a}
.form{background:#0f1f0f;border-radius:12px;padding:20px;margin-top:18px;text-align:left}
.form input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #2a4a2a;background:#0a140a;color:#fff;font-size:15px}
.btn-save{width:100%;padding:14px;background:#22c55e;color:#000;font-weight:800;border:none;border-radius:8px;margin-top:12px;cursor:pointer;font-size:15px}
.paypal-wrap{margin-top:20px;background:#fff;border-radius:8px;padding:10px;min-height:60px}
.footer{text-align:center;padding:30px 0;color:#5a7a5a;font-size:12px;border-top:1px solid #1a2e1a;margin-top:50px}
.tick{color:#22c55e}
</style>
</head>
<body>
<div class="container">
<nav><div class="logo">Howzit<span>Bot</span></div><div style="color:#8abf8a;font-size:12px">
